name: Build TUI binaries (OpenCode việt hoá)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  OPENCODE_REPO: https://github.com/anomalyco/opencode.git
  # Commit upstream mà từ điển việt hoá đã được kiểm chứng (đổi khi nâng cấp OpenCode).
  OPENCODE_COMMIT: b471c2b4495747353af768fbf2e0790c9d820ce2
  OPENCODE_SOURCE: ${{ github.workspace }}/opencode-src

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset: opencode-windows-x64.exe
          - runner: ubuntu-24.04-arm
            asset: opencode-linux-arm64
          - runner: ubuntu-latest
            asset: opencode-linux-x64
          - runner: macos-14 # Apple Silicon (arm64)
            asset: opencode-darwin-arm64
          - runner: macos-13 # Intel (x64)
            asset: opencode-darwin-x64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Clone OpenCode tại commit ghim
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$OPENCODE_REPO" "$OPENCODE_SOURCE"
          git -C "$OPENCODE_SOURCE" checkout "$OPENCODE_COMMIT"

      - name: Cài phụ thuộc (bun install)
        shell: bash
        working-directory: ${{ env.OPENCODE_SOURCE }}
        run: bun install

      - name: Áp từ điển việt hoá (idempotent)
        shell: bash
        run: node tools/opencode-vi/patch.mjs

      - name: Build host target (kèm smoke test --version của OpenCode)
        shell: bash
        working-directory: ${{ env.OPENCODE_SOURCE }}/packages/opencode
        run: bun run script/build.ts --single --skip-embed-web-ui --skip-install

      - name: Thu binary
        shell: bash
        run: |
          set -euo pipefail
          src=$(find "$OPENCODE_SOURCE/packages/opencode/dist" -type f -path "*/bin/opencode*" | head -n1)
          test -n "$src"
          echo "built: $src ($(du -h "$src" | cut -f1))"
          mkdir -p out
          cp "$src" "out/${{ matrix.asset }}"
          chmod +x "out/${{ matrix.asset }}" || true
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          compression-level: 0 # binary đã nén sẵn, khỏi zip lại cho nhanh

  release:
    name: Đăng asset lên Release
    needs: build
    # Vẫn chạy nếu một vài matrix lỗi — đăng những asset build được.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Tạo/đăng release (kèm asset)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
