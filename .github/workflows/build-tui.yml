name: Build TUI binaries (Crizon)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Nguồn TUI (biến repo — đổi khi nâng cấp): CRIZON_TUI_UPSTREAM_REPO / CRIZON_TUI_UPSTREAM_COMMIT
  TUI_REPO: ${{ vars.CRIZON_TUI_UPSTREAM_REPO }}
  TUI_COMMIT: ${{ vars.CRIZON_TUI_UPSTREAM_COMMIT }}
  CRIZON_TUI_SOURCE: ${{ github.workspace }}/tui-src

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset: crizon-tui-windows-x64.exe
          - runner: ubuntu-24.04-arm
            asset: crizon-tui-linux-arm64
          - runner: ubuntu-latest
            asset: crizon-tui-linux-x64
          - runner: macos-14 # Apple Silicon (arm64)
            asset: crizon-tui-darwin-arm64
          - runner: macos-15-intel # Intel (x64) — macos-13 đã bị GitHub khai tử
            asset: crizon-tui-darwin-x64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Clone TUI source (commit ghim)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TUI_REPO"
          test -n "$TUI_COMMIT"
          git clone --filter=blob:none "$TUI_REPO" "$CRIZON_TUI_SOURCE"
          git -C "$CRIZON_TUI_SOURCE" checkout "$TUI_COMMIT"

      - name: Cài phụ thuộc (bun install)
        shell: bash
        working-directory: ${{ env.CRIZON_TUI_SOURCE }}
        run: bun install

      - name: Áp từ điển việt hoá (idempotent)
        shell: bash
        run: node tools/tui-vi/patch.mjs

      - name: Build host target (kèm smoke test --version)
        shell: bash
        working-directory: ${{ env.CRIZON_TUI_SOURCE }}/packages/opencode
        run: bun run script/build.ts --single --skip-embed-web-ui --skip-install

      - name: Thu binary
        shell: bash
        run: |
          set -euo pipefail
          src=$(find "$CRIZON_TUI_SOURCE/packages/opencode/dist" -type f -path "*/bin/opencode*" | head -n1)
          test -n "$src"
          echo "built: $src ($(du -h "$src" | cut -f1))"
          mkdir -p out
          cp "$src" "out/${{ matrix.asset }}"
          chmod +x "out/${{ matrix.asset }}" || true
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          compression-level: 0 # binary đã nén sẵn, khỏi zip lại cho nhanh

  release:
    name: Đăng asset lên Release
    needs: build
    # Vẫn chạy nếu một vài matrix lỗi — đăng những asset build được.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Tạo/đăng release (kèm asset)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
