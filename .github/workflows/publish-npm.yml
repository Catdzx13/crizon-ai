name: Publish to npm

# Chạy tay khi muốn phát hành lên npm (cần secret NPM_TOKEN — token Automation của npmjs.com).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # cho provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Kiểm tra test trước khi phát hành
        run: node --test

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
